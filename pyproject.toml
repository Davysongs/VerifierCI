[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "verifierci"
version = "0.1.0"
description = "Foundation package for verifier change-impact infrastructure and evidence-based audit workflows."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "click>=8.1,<9",
  "jsonschema>=4.23,<5",
  "PyYAML>=6,<7",
  "jinja2>=3.1,<4",
  "packaging>=24,<27",
]

[project.scripts]
verifierci = "verifierci.cli:main"

[project.optional-dependencies]
analysis = ["numpy>=2,<3", "scipy>=1.14,<2"]

[dependency-groups]
dev = ["ruff>=0.9,<1", "mypy>=1.14,<2", "build>=1.2,<2", "twine>=6,<7"]
test = ["pytest>=8,<10", "pytest-cov>=6,<8", "hypothesis>=6,<7", "testcontainers>=4,<5"]
docs = ["mkdocs>=1.6,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/verifierci"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["property", "requires_docker", "no_secrets_required", "trusted_fixture"]
pythonpath = ["src"]
