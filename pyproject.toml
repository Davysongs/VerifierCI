[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verifierci"
version = "0.0.0"
description = "Foundation package for verifier change-impact infrastructure and evidence-based audit workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.urls]
Homepage = "https://github.com/your-org/verifierci"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
verifierci = "verifierci.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
pythonpath = ["src"]
